<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>胶卷浏览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="interface2.css">
  <link rel="stylesheet" href="gift-system.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html">← 返回胶卷柜</a>
      <button id="upload-zone" type="button">＋ 上传照片</button>
      <button id="annotation-toggle" type="button">进入备注模式</button>
      <button id="annotation-back" type="button" hidden>← 返回浏览</button>
    </div>
    <span id="archive-code"></span>
    <div class="topbar-actions">
      <button id="detail-background-toggle" type="button">🎨 更换背景</button>
      <button id="download" type="button">下载胶卷</button>
    </div>
  </header>

  <aside class="detail-background-panel" id="detail-background-panel" aria-hidden="true">
    <div class="detail-background-panel-head"><div><p>PAGE MOOD</p><h2>更换背景</h2></div><button id="detail-background-close" type="button" aria-label="关闭背景设置">×</button></div>
    <p class="detail-background-label">预设背景</p>
    <div id="detail-background-presets" class="detail-background-presets"></div>
    <p class="detail-background-label">自定义背景</p>
    <label class="detail-background-upload" for="detail-background-file">上传背景图<input id="detail-background-file" type="file" accept="image/*" hidden></label>
    <small>仅保存到胶卷浏览页，不会影响胶卷柜</small>
  </aside>

  <main class="tabletop-scene">
    <div class="left-film-stack">
      <section class="canister-zone" aria-label="胶卷暗盒">
        <div class="detail-model"><canvas id="model-canvas"></canvas></div>
        <div class="canister-camera-sticker" id="canister-camera-sticker" aria-hidden="true">
          <img id="canister-camera-image" src="assets/camera-1.png" alt="相机贴纸">
          <span id="canister-camera-fallback" aria-hidden="true">◉</span>
          <b id="canister-camera-label"></b>
        </div>
        <h1 id="film-title" hidden>KENTMERE PAN 400</h1>
        <p id="film-meta" hidden></p>
      </section>

      <section class="film-path" aria-label="从胶卷拉出的底片">
        <p class="film-path-label">SELECT A FRAME · CLICK EMPTY FRAME TO UPLOAD</p>
        <div class="film-ribbon" id="strip"></div>
      </section>
    </div>

    <section class="polaroid-zone" aria-label="选中的照片预览">
      <div class="polaroid">
        <div class="polaroid-image" id="large-preview"><span class="preview-placeholder">选择左侧底片<br>查看冲印照片</span></div>
        <div class="polaroid-caption"><strong id="selected-label">FRAME 01</strong><span id="selected-name">EMPTY NEGATIVE</span></div>
      </div>
      <div class="media-controls" aria-label="照片音频与放映控制">
        <input id="audio-file" type="file" accept="audio/*" hidden>
        <button id="audio-upload" class="control-button" type="button"><span class="control-icon">＋</span>添加音乐</button>
        <button id="audio-toggle" class="control-button" type="button" disabled aria-label="播放当前照片音乐"><span class="control-icon">🔊</span><span>播放音乐</span></button>
        <span class="sound-wave" id="sound-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <button id="tour-toggle" class="control-button projection-button" type="button"><span class="control-icon">▶</span>一键放映</button>
        <label class="switch-control"><input id="tour-notes" type="checkbox" checked><span></span>带上备注</label>
        <label class="switch-control"><input id="tour-audio" type="checkbox"><span></span>带上音乐</label>
      </div>
      <div class="camera-meta-row">
        <label class="camera-label-control"><span>CAMERA /</span><input id="camera-label-input" type="text" maxlength="32" placeholder="输入相机型号（如：Leica M6）"></label>
        <div class="camera-choice" aria-label="选择相机贴纸">
          <button class="is-selected" type="button" data-camera-icon="camera-1" aria-label="选择相机贴纸一"><img src="assets/camera-1.png" alt="" onerror="this.style.display='none'"><span>CAM 01</span></button>
          <button type="button" data-camera-icon="camera-2" aria-label="选择相机贴纸二"><img src="assets/camera-2.png" alt="" onerror="this.style.display='none'"><span>CAM 02</span></button>
        </div>
      </div>
      <div class="upload-dock">
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <textarea id="photo-note" class="note-editor" rows="2" placeholder="在此输入照片备注..."></textarea>
        <div class="note-toolbar" aria-label="手帐元素快捷栏">
          <button type="button" data-insert="🎀" aria-label="插入蝴蝶结">🎀</button>
          <button type="button" data-insert="✨" aria-label="插入闪光">✨</button>
          <button type="button" data-insert="💡" aria-label="插入灵感灯泡">💡</button>
          <button type="button" data-insert="❤️" aria-label="插入爱心">❤️</button>
          <button type="button" data-insert=" ➝ " aria-label="插入虚线箭头">
            <svg viewBox="0 0 52 20" aria-hidden="true"><path d="M2 10h37"/><path d="m32 4 8 6-8 6"/></svg>
          </button>
          <button type="button" data-insert="〰️" aria-label="插入波浪线">
            <svg viewBox="0 0 52 20" aria-hidden="true"><path d="M2 11c6-12 12 12 18 0s12 12 18 0"/></svg>
          </button>
        </div>
        <div class="annotation-controls">
          <button id="annotation-add" type="button" hidden>＋ 新增备注</button>
          <button id="annotation-style" type="button" hidden>文字样式</button>
          <button id="annotation-confirm" type="button" hidden>确认备注</button>
        </div>
        <div class="text-style-popover" id="text-style-popover" hidden>
          <p>在线艺术字</p>
          <div class="font-choices">
            <button type="button" data-font="zhi">手写随记</button>
            <button type="button" data-font="ma">毛笔标题</button>
            <button type="button" data-font="long">涂鸦感</button>
            <button type="button" data-font="serif">复古宋体</button>
          </div>
          <div class="weight-choices">
            <button type="button" data-weight="400">常规</button>
            <button type="button" data-weight="700">加粗</button>
            <button type="button" data-weight="900">特粗</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <!-- 独立放映厅：两张叠放图片负责交叉淡入淡出；齿孔、暗角和颗粒均为 CSS 图层。 -->
  <section id="projector-hall" class="projector-hall" aria-label="沉浸式放映厅" aria-hidden="true">
    <nav id="projector-thumbnails" class="projector-thumbnails" aria-label="放映照片导航"></nav>
    <div class="projector-stage">
      <div class="projector-perforations projector-perforations-top" aria-hidden="true"></div>
      <div class="projector-screen" id="projector-screen">
        <img class="projector-image is-active" id="projector-image-a" alt="">
        <img class="projector-image" id="projector-image-b" alt="">
        <div class="projector-vignette" aria-hidden="true"></div>
        <div class="projector-grain" aria-hidden="true"></div>
      </div>
      <div class="projector-perforations projector-perforations-bottom" aria-hidden="true"></div>
    </div>
  </section>
  <button id="projector-exit" class="projector-exit" type="button" hidden>× 退出放映</button>
  <script src="interface2.js"></script>
  <script src="detail-model.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="gift-system.js"></script>
</body>
</html>
